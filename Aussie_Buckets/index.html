<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aussie Buckets</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
    <link rel="stylesheet" href="../Aussie_Buckets/style.css">
    <link rel="stylesheet" href="../Aussie_Buckets/Attachments_Hover.css">
</head>
<body>
    <section class="header"></section>
    <section class="footer">   </section>            
    <div class="navbar_dropdown_list"></div>


   
  

<script type="module">
  import { NavCom } from "./Components/Navbar.js";
  import {FooterCom} from "./Components/Footer.js";
  import{ AttachmentsCom} from "./Components/Attachments_Hover.js";
  

  //Navbar
  document.querySelector(".header").innerHTML = NavCom(
    "../Aussie_Buckets/Utils/Navbar_img/68917553c998217dbf60a490_ab_logo_gray.svg",
    "../Aussie_Buckets/Utils/Navbar_img/download.png"
  );
  // Footer 
  document.querySelector(".footer").innerHTML =  FooterCom(
    "../Aussie_Buckets/Utils/Navbar_img/68917553c998217dbf60a490_ab_logo_gray.svg"
  );
    
//   Attachments hover
  document.querySelector(".navbar_dropdown_list").innerHTML = AttachmentsCom(
    "../Aussie_Buckets/Utils/Navbar_img/66b45e6970d801a07e1e554f_Rock Bucket.png",
    "../Aussie_Buckets/Utils/Navbar_img/681c2da33d2d2737e9ef700f_0_feature.webp",
    "../Aussie_Buckets/Utils/Navbar_img/67fde3ca59edc39ee3216697_1.webp",
    "../Aussie_Buckets/Utils/Navbar_img/67ef790c9e995d6ee2c1cebf_tillt_rotator_nav_02.webp",
    "../Aussie_Buckets/Utils/Navbar_img/67eb6b91a1d5739ffa1d1199_1_Daemo_smart_breaker_series_SME.png",
    "../Aussie_Buckets/Utils/Navbar_img/66c41153cb48e161387426d3_Multisystem.png"
  );


  
setTimeout(() => {
      const dropdown = document.querySelector(".navbar_dropdown_list");
      const trigger = document.querySelector(".Attachments");

      if (dropdown && trigger) {
        // Show dropdown
        trigger.addEventListener("mouseenter", () => {
          dropdown.style.display = "block";
          setTimeout(() => (dropdown.style.opacity = "1"), 10);
        });

        // Keep open when hovering over dropdown
        dropdown.addEventListener("mouseenter", () => {
          dropdown.style.display = "block";
          dropdown.style.opacity = "1";
        });

        // Hide dropdown on leave
        trigger.addEventListener("mouseleave", () => {
          dropdown.style.opacity = "0";
          setTimeout(() => {
            if (!dropdown.matches(":hover")) dropdown.style.display = "none";
          }, 300);
        });

        dropdown.addEventListener("mouseleave", () => {
          dropdown.style.opacity = "0";
          setTimeout(() => (dropdown.style.display = "none"), 300);
        });
      } else {
        console.warn("⚠️ Attachments trigger or dropdown not found!");
      }
    }, 500);
 





</script> 
<!-- <script src="./script.js"></script> -->
 
    
</body>
</html>
